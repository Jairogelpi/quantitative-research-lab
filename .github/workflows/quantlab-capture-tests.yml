name: QuantLab Python tests

on:
  pull_request:
    paths:
      - "proyecto/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/quantlab-capture-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test radar without live API calls
        env:
          PYTHONPATH: proyecto
        run: python -m pytest -q proyecto/tests -m "not live"
